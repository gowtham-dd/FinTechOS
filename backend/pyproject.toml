[project]
name = "quantum-fintech-agentos-backend"
version = "0.1.0"
description = "Backend for Quantum FinTech AgentOS — AI Agent Factory & Quantum Optimization Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-groq>=0.1.1",
    "langgraph>=0.0.30",
    "networkx>=3.2.1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scipy>=1.12.0",
    "pyqubo>=1.4.0",
    "redis>=5.0.3",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
